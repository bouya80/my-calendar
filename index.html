<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>나만의 달력</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
            --sunday-color: #ff453a;
            --saturday-color: #64d2ff;
            --lunar-color: #a1a1a6;
            --grid-border: #2c2c2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        header { padding: 16px 20px 12px 20px; display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .month-year { font-size: 20px; font-weight: 700; color: #ffffff; }
        .nav-btns { display: flex; gap: 8px; }
        .btn-icon { background: #2c2c2e; border: 1px solid var(--border-color); color: #ffffff; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 10px 0; font-size: 13px; font-weight: 600; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .weekdays div:nth-child(1) { color: var(--sunday-color); }
        .weekdays div:nth-child(7) { color: var(--saturday-color); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex-grow: 1; background-color: var(--bg-color); }
        .day-cell { min-height: 90px; border-right: 1px solid var(--grid-border); border-bottom: 1px solid var(--grid-border); padding: 6px; display: flex; flex-direction: column; cursor: pointer; background-color: var(--bg-color); }
        .day-cell:nth-child(7n) { border-right: none; }
        .day-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .solar-num { font-size: 15px; font-weight: 600; color: #ffffff; }
        .day-cell.other-month .solar-num { opacity: 0.3; }
        .day-cell.sun .solar-num, .day-cell.holiday .solar-num { color: var(--sunday-color) !important; }
        .day-cell.sat .solar-num { color: var(--saturday-color); }
        .lunar-info { display: flex; flex-direction: column; align-items: flex-end; }
        .lunar-num { font-size: 9px; color: var(--lunar-color); }
        .holiday-name { font-size: 9px; color: var(--sunday-color); font-weight: 600; margin-top: 1px; }
        
        .day-cell.today .solar-num { background-color: var(--accent-color); color: #ffffff !important; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
        .event-badge { font-size: 11px; background-color: rgba(10, 132, 255, 0.25); color: #64d2ff; border-left: 3px solid var(--accent-color); padding: 2px 4px; margin-top: 2px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .toolbar { padding: 12px 16px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; gap: 8px; }
        .btn-action { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #2c2c2e; color: #ffffff; font-size: 13px; font-weight: 500; cursor: pointer; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: var(--card-bg); width: 100%; max-width: 500px; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; background: #121212; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .form-row { display: flex; gap: 8px; }
        input[type="text"], input[type="time"], textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #2c2c2e; color: #fff; font-size: 14px; }
        textarea { resize: none; height: 50px; }
        .btn-add { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
        
        .modal-event-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
        .event-card { background: #2c2c2e; border-radius: 8px; padding: 12px; border-left: 4px solid var(--accent-color); display: flex; flex-direction: column; gap: 4px; }
        .event-card-header { display: flex; justify-content: space-between; align-items: center; }
        .event-card-title { font-size: 15px; font-weight: bold; color: #fff; }
        .event-card-time { font-size: 12px; color: #64d2ff; }
        .event-card-location { font-size: 12px; color: var(--text-muted); }
        .event-card-memo { font-size: 13px; color: #d1d1d6; margin-top: 4px; white-space: pre-wrap; background: #1c1c1e; padding: 6px; border-radius: 4px; }
        .btn-del-card { background: none; border: none; color: var(--sunday-color); font-weight: bold; font-size: 13px; cursor: pointer; }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="month-year" id="monthYearText"></div>
        <div class="nav-btns">
            <button class="btn-icon" id="prevBtn">‹ 이전</button>
            <button class="btn-icon" id="todayBtn">오늘</button>
            <button class="btn-icon" id="nextBtn">다음 ›</button>
        </div>
    </header>

    <div class="weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="toolbar">
        <button class="btn-action" id="exportTxtBtn">📄 TXT 백업</button>
        <button class="btn-action" id="exportCsvBtn">📊 Excel 백업</button>
        <button class="btn-action" id="importBtn">📥 불러오기</button>
        <input type="file" id="fileInput" accept=".txt,.csv">
    </div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalDateTitle" style="font-size: 16px; font-weight: bold;">일정 관리</div>
                <button style="background:none; border:none; color:var(--text-muted); font-size:20px;" id="closeModalBtn">✕</button>
            </div>
            
            <div class="form-group">
                <input type="text" id="eventTitleInput" placeholder="일정 제목 (필수)">
                <div class="form-row">
                    <input type="time" id="eventTimeInput" placeholder="시간">
                    <input type="text" id="eventLocInput" placeholder="장소">
                </div>
                <textarea id="eventMemoInput" placeholder="상세 메모..."></textarea>
                <button class="btn-add" id="addEventBtn">일정 등록</button>
            </div>

            <div class="modal-event-list" id="modalEventList"></div>
        </div>
    </div>

    <script>
        // 한국 공휴일 데이터베이스 (고정 양력 + 음력/대체 공휴일 매핑)
        const fixedHolidays = {
            "01-01": "신정",
            "03-01": "삼일절",
            "05-05": "어린이날",
            "06-06": "현충일",
            "08-15": "광복절",
            "10-03": "개천절",
            "10-09": "한글날",
            "12-25": "성탄절"
        };

        const variableHolidays = {
            // 2025년
            "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
            "2025-05-05": "어린이날/부처님오신날", "2025-05-06": "대체공휴일",
            "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
            // 2026년
            "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
            "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
            "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
            // 2027년
            "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
            "2027-05-13": "부처님오신날",
            "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴"
        };

        function getHolidayName(dateStr) {
            // dateStr format: YYYY-MM-DD
            if (variableHolidays[dateStr]) return variableHolidays[dateStr];
            const mmdd = dateStr.substring(5);
            if (fixedHolidays[mmdd]) return fixedHolidays[mmdd];
            return null;
        }

        function getLunarText(y, m, d) {
            try {
                const solar = new Date(y, m - 1, d);
                const base = new Date(2026, 0, 1);
                const diffDays = Math.floor((solar - base) / 86400000);
                let totalLunarDays = diffDays + 13;
                let approxLunarMonth = Math.floor(totalLunarDays / 29.530588) + 11;
                let approxLunarDay = Math.floor(totalLunarDays % 29.530588) + 1;
                if (approxLunarDay <= 0) approxLunarDay += 30;
                let lm = (approxLunarMonth % 12); if (lm === 0) lm = 12;
                return `${lm}.${approxLunarDay}`;
            } catch (e) {
                return "";
            }
        }

        let currentDate = new Date();
        let selectedDateStr = "";
        let events = JSON.parse(localStorage.getItem("my_calendar_events") || "{}");

        const monthYearText = document.getElementById("monthYearText");
        const calendarGrid = document.getElementById("calendarGrid");

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearText.textContent = `${year}년 ${month + 1}월`;
            calendarGrid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            for (let i = firstDay - 1; i >= 0; i--) {
                calendarGrid.appendChild(createDayCell(year, month - 1, prevLastDate - i, true));
            }
            for (let d = 1; d <= lastDate; d++) {
                calendarGrid.appendChild(createDayCell(year, month, d, false, isCurrentMonth && today.getDate() === d));
            }
            const totalCells = calendarGrid.children.length;
            const remainingCells = (totalCells <= 35 ? 35 : 42) - totalCells;
            for (let j = 1; j <= remainingCells; j++) {
                calendarGrid.appendChild(createDayCell(year, month + 1, j, true));
            }
        }

        function createDayCell(y, m, d, isOtherMonth, isToday = false) {
            const targetDate = new Date(y, m, d);
            const actualY = targetDate.getFullYear();
            const actualM = targetDate.getMonth() + 1;
            const actualD = targetDate.getDate();
            const dayOfWeek = targetDate.getDay();

            const dateKey = `${actualY}-${String(actualM).padStart(2, '0')}-${String(actualD).padStart(2, '0')}`;
            const holidayName = getHolidayName(dateKey);

            const cell = document.createElement("div");
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${dayOfWeek === 0 ? 'sun' : ''} ${dayOfWeek === 6 ? 'sat' : ''} ${holidayName ? 'holiday' : ''}`;

            const lunarStr = getLunarText(actualY, actualM, actualD);

            cell.innerHTML = `
                <div class="day-header">
                    <span class="solar-num">${actualD}</span>
                    <div class="lunar-info">
                        <span class="lunar-num">${lunarStr}</span>
                        ${holidayName ? `<span class="holiday-name">${holidayName}</span>` : ''}
                    </div>
                </div>
                <div class="event-list-preview" id="preview-${dateKey}"></div>
            `;

            const dayEvents = events[dateKey] || [];
            const previewContainer = cell.querySelector(`#preview-${dateKey}`);
            
            dayEvents.slice(0, 2).forEach(evt => {
                const b = document.createElement("div");
                b.className = "event-badge";
                const timePrefix = evt.time ? `[${evt.time}] ` : "";
                b.textContent = `${timePrefix}${evt.title}`;
                previewContainer.appendChild(b);
            });

            if (dayEvents.length > 2) {
                const more = document.createElement("div");
                more.className = "event-badge";
                more.style.opacity = "0.6";
                more.textContent = `+${dayEvents.length - 2}개 더보기`;
                previewContainer.appendChild(more);
            }

            cell.addEventListener("click", () => openEventModal(dateKey, actualY, actualM, actualD, holidayName));
            return cell;
        }

        function openEventModal(dateKey, y, m, d, holidayName) {
            selectedDateStr = dateKey;
            let titleText = `${y}년 ${m}월 ${d}일 일정 상세`;
            if (holidayName) titleText += ` (${holidayName})`;
            document.getElementById("modalDateTitle").textContent = titleText;
            clearInputs();
            renderModalEvents();
            document.getElementById("eventModal").classList.add("active");
        }

        function clearInputs() {
            document.getElementById("eventTitleInput").value = "";
            document.getElementById("eventTimeInput").value = "";
            document.getElementById("eventLocInput").value = "";
            document.getElementById("eventMemoInput").value = "";
        }

        function renderModalEvents() {
            const list = document.getElementById("modalEventList");
            list.innerHTML = "";
            const dayEvents = events[selectedDateStr] || [];

            if (dayEvents.length === 0) {
                list.innerHTML = `<div style="color:var(--text-muted); font-size:13px; text-align:center; padding:12px;">등록된 일정이 없습니다.</div>`;
                return;
            }

            dayEvents.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

            dayEvents.forEach((evt, idx) => {
                const card = document.createElement("div");
                card.className = "event-card";
                
                let html = `
                    <div class="event-card-header">
                        <span class="event-card-title">${evt.title}</span>
                        <button class="btn-del-card" onclick="deleteEvent(${idx})">삭제</button>
                    </div>
                `;
                if (evt.time) html += `<div class="event-card-time">⏰ ${evt.time}</div>`;
                if (evt.location) html += `<div class="event-card-location">📍 ${evt.location}</div>`;
                if (evt.memo) html += `<div class="event-card-memo">${evt.memo}</div>`;

                card.innerHTML = html;
                list.appendChild(card);
            });
        }

        function addEvent() {
            const title = document.getElementById("eventTitleInput").value.trim();
            if (!title) {
                alert("일정 제목을 입력해 주세요.");
                return;
            }

            const time = document.getElementById("eventTimeInput").value;
            const location = document.getElementById("eventLocInput").value.trim();
            const memo = document.getElementById("eventMemoInput").value.trim();

            if (!events[selectedDateStr]) events[selectedDateStr] = [];
            
            events[selectedDateStr].push({ title, time, location, memo });
            localStorage.setItem("my_calendar_events", JSON.stringify(events));

            clearInputs();
            renderModalEvents();
            renderCalendar();
        }

        window.deleteEvent = function(idx) {
            if (events[selectedDateStr]) {
                events[selectedDateStr].splice(idx, 1);
                if (events[selectedDateStr].length === 0) delete events[selectedDateStr];
                localStorage.setItem("my_calendar_events", JSON.stringify(events));
                renderModalEvents();
                renderCalendar();
            }
        };

        document.getElementById("exportTxtBtn").addEventListener("click", () => {
            let txt = "=== 상세 일정 백업 ===\n\n";
            Object.keys(events).sort().forEach(k => {
                txt += `[${k}]\n`;
                events[k].forEach(e => {
                    txt += `- 제목: ${e.title}\n`;
                    if (e.time) txt += `  시간: ${e.time}\n`;
                    if (e.location) txt += `  장소: ${e.location}\n`;
                    if (e.memo) txt += `  메모: ${e.memo}\n`;
                });
                txt += "\n";
            });
            downloadFile(txt, "calendar_backup.txt", "text/plain");
        });

        document.getElementById("exportCsvBtn").addEventListener("click", () => {
            let csv = "\uFEFF날짜,시간,일정명,장소,메모\n";
            Object.keys(events).sort().forEach(k => {
                events[k].forEach(e => {
                    const title = (e.title || "").replace(/"/g, '""');
                    const time = e.time || "";
                    const loc = (e.location || "").replace(/"/g, '""');
                    const memo = (e.memo || "").replace(/"/g, '""').replace(/\n/g, ' ');
                    csv += `"${k}","${time}","${title}","${loc}","${memo}"\n`;
                });
            });
            downloadFile(csv, "calendar_events.csv", "text/csv");
        });

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById("importBtn").addEventListener("click", () => document.getElementById("fileInput").click());

        document.getElementById("fileInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const text = evt.target.result;
                    if (file.name.endsWith('.csv')) {
                        text.split(/\r\n|\n/).forEach((line, idx) => {
                            if (idx === 0 || !line.trim()) return;
                            const parts = line.split(',');
                            if (parts.length >= 3) {
                                const d = parts[0].replace(/"/g, '').trim();
                                const t = parts[1].replace(/"/g, '').trim();
                                const title = parts[2].replace(/"/g, '').trim();
                                const loc = parts[3] ? parts[3].replace(/"/g, '').trim() : "";
                                const memo = parts[4] ? parts[4].replace(/"/g, '').trim() : "";
                                if (d && title) {
                                    if (!events[d]) events[d] = [];
                                    events[d].push({ title, time: t, location: loc, memo });
                                }
                            }
                        });
                    }
                    localStorage.setItem("my_calendar_events", JSON.stringify(events));
                    renderCalendar();
                    alert("복원이 완료되었습니다.");
                } catch (err) {
                    alert("파일 복원 중 오류가 발생했습니다.");
                }
            };
            reader.readAsText(file);
        });

        document.getElementById("prevBtn").addEventListener("click", () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById("nextBtn").addEventListener("click", () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        document.getElementById("todayBtn").addEventListener("click", () => { currentDate = new Date(); renderCalendar(); });
        document.getElementById("closeModalBtn").addEventListener("click", () => document.getElementById("eventModal").classList.remove("active"));
        document.getElementById("addEventBtn").addEventListener("click", addEvent);

        renderCalendar();
    </script>
</body>
</html>
