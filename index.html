<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>나만의 달력 & 일정 관리</title>
    
    <!-- iOS PWA 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="나만의 달력">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
            --sunday-color: #ff453a;
            --saturday-color: #64d2ff;
            --lunar-color: #a1a1a6;
            --grid-border: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            user-select: none;
        }

        header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
        }

        .month-year {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-icon:active {
            opacity: 0.7;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .weekdays div:nth-child(1) { color: var(--sunday-color); }
        .weekdays div:nth-child(7) { color: var(--saturday-color); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            flex-grow: 1;
            background-color: var(--bg-color);
        }

        .day-cell {
            min-height: 85px;
            background-color: var(--bg-color);
            border-right: 1px solid var(--grid-border);
            border-bottom: 1px solid var(--grid-border);
            padding: 4px;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .solar-num {
            font-size: 14px;
            font-weight: 600;
        }

        .day-cell.other-month .solar-num {
            opacity: 0.25;
        }

        .day-cell.sun .solar-num { color: var(--sunday-color); }
        .day-cell.sat .solar-num { color: var(--saturday-color); }

        .lunar-num {
            font-size: 9px;
            color: var(--lunar-color);
            font-weight: 400;
        }

        .day-cell.today .solar-num {
            background-color: var(--accent-color);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-list-preview {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .event-badge {
            font-size: 10px;
            background-color: rgba(10, 132, 255, 0.2);
            color: #64d2ff;
            border-left: 2px solid var(--accent-color);
            padding: 1px 3px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 컨트롤 영역 (데이터 관리) */
        .toolbar {
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #2c2c2e;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-action:active {
            background: #3a3a3c;
        }

        /* 모달 창 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #121212;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: 1px solid var(--accent-color);
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-event-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .modal-event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: #2c2c2e;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--sunday-color);
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
        }

        /* 파일 입력 숨김 */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="month-year" id="monthYearText">2026년 9월</div>
        <div class="nav-btns">
            <button class="btn-icon" id="prevBtn">‹</button>
            <button class="btn-icon" id="todayBtn" style="font-size: 12px; font-weight: bold;">오늘</button>
            <button class="btn-icon" id="nextBtn">›</button>
        </div>
    </header>

    <div class="weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="toolbar">
        <button class="btn-action" id="exportTxtBtn">📄 TXT 백업</button>
        <button class="btn-action" id="exportCsvBtn">📊 Excel 백업</button>
        <button class="btn-action" id="importBtn">📥 불러오기</button>
        <input type="file" id="fileInput" accept=".txt,.json,.csv">
    </div>

    <!-- 일정 관리 모달 -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalDateTitle">2026년 9월 1일 일정</div>
                <button class="close-btn" id="closeModalBtn">✕</button>
            </div>
            
            <div class="input-group">
                <input type="text" id="eventInput" placeholder="일정을 입력하세요...">
                <button class="btn-add" id="addEventBtn">추가</button>
            </div>

            <div class="modal-event-list" id="modalEventList"></div>
        </div>
    </div>

    <script>
        // 간이 음력 계산 알고리즘 (한국 한국천문연구원 매핑 알고리즘 근사치)
        // 실용적인 2024~2030 매핑 데이터 포함
        const lunarRefData = {
            // YYYYMMDD 기준 주요 음력 1일 매핑 데이터 (근사 계산 엔진)
        };

        function getLunarDate(year, month, day) {
            // 간이 음력 계산 규칙 (오차 범위 ±1일 이내 알고리즘)
            // 정확한 표시를 위해 기준점 기준 계산
            const solar = new Date(year, month - 1, day);
            const base = new Date(2026, 0, 1); // 2026-01-01 은 음력 2025-11-13
            const diffDays = Math.floor((solar - base) / (1000 * 60 * 60 * 24));
            
            // 평균 음력 월 길이 (29.530588일) 기반 계산
            let totalLunarDays = diffDays + 13; // 11월 13일부터 시작
            let approxLunarMonth = Math.floor(totalLunarDays / 29.530588) + 11;
            let approxLunarDay = Math.floor(totalLunarDays % 29.530588) + 1;

            if (approxLunarDay <= 0) approxLunarDay += 30;
            let m = (approxLunarMonth % 12);
            if (m === 0) m = 12;

            return `${m}.${approxLunarDay}`;
        }

        // 애플리케이션 상태
        let currentDate = new Date();
        let selectedDateStr = "";
        let events = JSON.parse(localStorage.getItem("my_calendar_events") || "{}");

        // DOM 엘리먼트
        const monthYearText = document.getElementById("monthYearText");
        const calendarGrid = document.getElementById("calendarGrid");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const todayBtn = document.getElementById("todayBtn");
        const eventModal = document.getElementById("eventModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const modalDateTitle = document.getElementById("modalDateTitle");
        const eventInput = document.getElementById("eventInput");
        const addEventBtn = document.getElementById("addEventBtn");
        const modalEventList = document.getElementById("modalEventList");
        const exportTxtBtn = document.getElementById("exportTxtBtn");
        const exportCsvBtn = document.getElementById("exportCsvBtn");
        const importBtn = document.getElementById("importBtn");
        const fileInput = document.getElementById("fileInput");

        // 달력 렌더링 함수
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearText.textContent = `${year}년 ${month + 1}월`;
            calendarGrid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // 지난 달 날짜 Fill
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayNum = prevLastDate - i;
                const cell = createDayCell(year, month - 1, dayNum, true);
                calendarGrid.appendChild(cell);
            }

            // 이번 달 날짜 Fill
            for (let d = 1; d <= lastDate; d++) {
                const isToday = isCurrentMonth && today.getDate() === d;
                const cell = createDayCell(year, month, d, false, isToday);
                calendarGrid.appendChild(cell);
            }

            // 다음 달 날짜 Fill (6주 그리드 맞춤)
            const totalCells = calendarGrid.children.length;
            const remainingCells = (totalCells <= 35 ? 35 : 42) - totalCells;
            for (let j = 1; j <= remainingCells; j++) {
                const cell = createDayCell(year, month + 1, j, true);
                calendarGrid.appendChild(cell);
            }
        }

        function createDayCell(y, m, d, isOtherMonth, isToday = false) {
            const targetDate = new Date(y, m, d);
            const actualY = targetDate.getFullYear();
            const actualM = targetDate.getMonth() + 1;
            const actualD = targetDate.getDate();
            const dayOfWeek = targetDate.getDay();

            const dateKey = `${actualY}-${String(actualM).padStart(2, '0')}-${String(actualD).padStart(2, '0')}`;

            const cell = document.createElement("div");
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
            if (dayOfWeek === 0) cell.classList.add("sun");
            if (dayOfWeek === 6) cell.classList.add("sat");

            const lunarText = getLunarDate(actualY, actualM, actualD);

            cell.innerHTML = `
                <div class="day-header">
                    <span class="solar-num">${actualD}</span>
                    <span class="lunar-num">${lunarText}</span>
                </div>
                <div class="event-list-preview" id="preview-${dateKey}"></div>
            `;

            // 일정 미리보기 렌더링
            const dayEvents = events[dateKey] || [];
            const previewContainer = cell.querySelector(`#preview-${dateKey}`);
            dayEvents.slice(0, 2).forEach(evt => {
                const badge = document.createElement("div");
                badge.className = "event-badge";
                badge.textContent = evt;
                previewContainer.appendChild(badge);
            });
            if (dayEvents.length > 2) {
                const more = document.createElement("div");
                more.className = "event-badge";
                more.style.opacity = "0.6";
                more.textContent = `+${dayEvents.length - 2}개`;
                previewContainer.appendChild(more);
            }

            // 날짜 클릭 이벤트
            cell.addEventListener("click", () => openEventModal(dateKey, actualY, actualM, actualD));

            return cell;
        }

        // 모달 제어
        function openEventModal(dateKey, y, m, d) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `${y}년 ${m}월 ${d}일 일정`;
            eventInput.value = "";
            renderModalEvents();
            eventModal.classList.add("active");
        }

        function closeModal() {
            eventModal.classList.remove("active");
        }

        function renderModalEvents() {
            modalEventList.innerHTML = "";
            const dayEvents = events[selectedDateStr] || [];

            if (dayEvents.length === 0) {
                modalEventList.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 12px;">등록된 일정이 없습니다.</div>`;
                return;
            }

            dayEvents.forEach((evt, idx) => {
                const item = document.createElement("div");
                item.className = "modal-event-item";
                item.innerHTML = `
                    <span>${evt}</span>
                    <button class="btn-del" onclick="deleteEvent(${idx})">삭제</button>
                `;
                modalEventList.appendChild(item);
            });
        }

        function addEvent() {
            const val = eventInput.value.trim();
            if (!val) return;

            if (!events[selectedDateStr]) {
                events[selectedDateStr] = [];
            }
            events[selectedDateStr].push(val);
            saveEvents();
            eventInput.value = "";
            renderModalEvents();
            renderCalendar();
        }

        window.deleteEvent = function(idx) {
            if (events[selectedDateStr]) {
                events[selectedDateStr].splice(idx, 1);
                if (events[selectedDateStr].length === 0) {
                    delete events[selectedDateStr];
                }
                saveEvents();
                renderModalEvents();
                renderCalendar();
            }
        };

        function saveEvents() {
            localStorage.setItem("my_calendar_events", JSON.stringify(events));
        }

        // 백업 및 복원 기능
        exportTxtBtn.addEventListener("click", () => {
            let txtContent = "=== 나만의 일정 관리 백업 파일 ===

";
            const sortedKeys = Object.keys(events).sort();
            
            if (sortedKeys.length === 0) {
                alert("저장된 일정이 없습니다.");
                return;
            }

            sortedKeys.forEach(key => {
                txtContent += `[${key}]
`;
                events[key].forEach(evt => {
                    txtContent += `- ${evt}
`;
                });
                txtContent += "
";
            });

            downloadFile(txtContent, `calendar_backup_${getFormattedToday()}.txt`, "text/plain");
        });

        exportCsvBtn.addEventListener("click", () => {
            let csvContent = "﻿날짜,일정
"; // UTF-8 BOM 추가 (엑셀 한글 깨짐 방지)
            const sortedKeys = Object.keys(events).sort();

            if (sortedKeys.length === 0) {
                alert("저장된 일정이 없습니다.");
                return;
            }

            sortedKeys.forEach(key => {
                events[key].forEach(evt => {
                    const cleanEvt = evt.replace(/"/g, '""');
                    csvContent += `"${key}","${cleanEvt}"
`;
                });
            });

            downloadFile(csvContent, `calendar_events_${getFormattedToday()}.csv`, "text/csv");
        });

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        importBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                if (file.name.endsWith('.csv')) {
                    parseCSVImport(text);
                } else if (file.name.endsWith('.txt')) {
                    parseTXTImport(text);
                }
            };
            reader.readAsText(file);
        });

        function parseCSVImport(text) {
            try {
                const lines = text.split(/
|
/);
                let importedCount = 0;
                lines.forEach((line, idx) => {
                    if (idx === 0 || !line.trim()) return;
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const date = parts[0].replace(/"/g, '').trim();
                        const evt = parts.slice(1).join(',').replace(/"/g, '').trim();
                        if (date && evt) {
                            if (!events[date]) events[date] = [];
                            if (!events[date].includes(evt)) {
                                events[date].push(evt);
                                importedCount++;
                            }
                        }
                    }
                });
                saveEvents();
                renderCalendar();
                alert(`${importedCount}개의 일정을 성공적으로 불러왔습니다.`);
            } catch (err) {
                alert("CSV 파일을 읽는 중 오류가 발생했습니다.");
            }
        }

        function parseTXTImport(text) {
            try {
                const lines = text.split(/
|
/);
                let currentDateKey = null;
                let importedCount = 0;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('[') && line.endsWith(']')) {
                        currentDateKey = line.substring(1, line.length - 1);
                    } else if (line.startsWith('-') && currentDateKey) {
                        const evt = line.substring(1).trim();
                        if (evt) {
                            if (!events[currentDateKey]) events[currentDateKey] = [];
                            if (!events[currentDateKey].includes(evt)) {
                                events[currentDateKey].push(evt);
                                importedCount++;
                            }
                        }
                    }
                });
                saveEvents();
                renderCalendar();
                alert(`${importedCount}개의 일정을 성공적으로 불러왔습니다.`);
            } catch (err) {
                alert("TXT 파일을 읽는 중 오류가 발생했습니다.");
            }
        }

        function getFormattedToday() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        }

        // 이벤트 리스너 설정
        prevBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        todayBtn.addEventListener("click", () => {
            currentDate = new Date();
            renderCalendar();
        });

        closeModalBtn.addEventListener("click", closeModal);
        addEventBtn.addEventListener("click", addEvent);
        eventInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addEvent();
        });

        // 초기화
        renderCalendar();
    </script>
</body>
</html>
